# TaurEye web server (STATIC hosting model).
# Install to /etc/nginx/conf.d/taureye.conf, then: sudo nginx -t && sudo systemctl reload nginx
#
# nginx serves the built SPA from the web root AND the precomputed JSON bundle
# under /data (regenerated nightly by refresh.sh). The screener and charts run
# client-side off that bundle — there is no live application backend.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Precomputed data bundle (manifest/fundamentals/indices + per-symbol candles).
    location /data/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        types { application/json json; }
        gzip on; gzip_types application/json;
        try_files $uri =404;
    }

    # Enable gzip for the text assets nginx serves (SPA JS/CSS/HTML/SVG).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_vary on;

    # Hashed build assets (Vite emits content-hashed filenames) — safe to cache
    # forever. This is the big PageSpeed "efficient cache lifetimes" win.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static media (icons, images, fonts, wordmark). Long cache; filenames are
    # stable, and a redeploy that changes one ships a new file anyway.
    location ~* \.(?:png|jpe?g|webp|avif|gif|ico|svg|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Admin console — a separate mini-app bundle (dist-admin), NOT part of the
    # user SPA. Kept out of search engines; the app itself gates on app_admins.
    location /admin/ {
        alias /usr/share/nginx/admin/;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin { return 301 /admin/; }

    # SPA shell: never cache index.html (must always fetch the latest asset refs).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: fall back to index.html for client-side routes (deep links).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
