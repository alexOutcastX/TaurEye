# TaurEye web server (STATIC hosting model).
# Install to /etc/nginx/conf.d/taureye.conf, then: sudo nginx -t && sudo systemctl reload nginx
#
# nginx serves the built SPA from the web root AND the precomputed JSON bundle
# under /data (regenerated nightly by refresh.sh). The screener and charts run
# client-side off that bundle — there is no live application backend.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Precomputed data bundle (manifest/fundamentals/indices + per-symbol candles).
    location /data/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        types { application/json json; }
        gzip on; gzip_types application/json;
        try_files $uri =404;
    }

    # SPA: fall back to index.html for client-side routes (deep links).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
