# TaurEye — all-in-one app stack for an Azure VM (Docker).
#   ./up.sh            # brings up Supabase + this stack
#   docker compose up -d --build      # this stack only (web + dataengine + scheduler)
#
# This compose runs the TaurEye APP layer. Supabase runs as its own stack from
# ./supabase-docker (the official supabase/docker compose) — see DEPLOY-AZURE.md.
# The browser reaches Supabase over HTTPS at https://api.taureye.com (host nginx
# terminates TLS and proxies to Kong on localhost:8000). The site is HTTPS, so it
# MUST call an HTTPS Supabase URL — a plain http://<IP>:8000 is blocked as mixed
# content. Override VITE_SUPABASE_URL in .env to point elsewhere (e.g. Cloud).
name: taureye

services:
  # ---- Static SPA + the /data bundle (nginx, published directly on :80) ----
  web:
    build:
      context: ../..
      dockerfile: deploy/azure/Dockerfile.web
      args:
        VITE_DATA_SOURCE: local
        VITE_DATA_BASE: ""              # same-origin /data
        VITE_CANDLE_BASE: ""
        VITE_AI_MODE: ${VITE_AI_MODE:-cache}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://api.taureye.com}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_OAUTH_PROVIDERS: ${VITE_OAUTH_PROVIDERS:-}
        VITE_ADSENSE_CLIENT: ${VITE_ADSENSE_CLIENT:-}
        VITE_ADSENSE_SLOT_SCREENER: ${VITE_ADSENSE_SLOT_SCREENER:-}
        VITE_ADSENSE_SLOT_WALLET: ${VITE_ADSENSE_SLOT_WALLET:-}
        # Google Analytics 4 (public measurement id; override in .env if it changes)
        VITE_GA_ID: ${VITE_GA_ID:-G-G1HT6F4ND3}
    image: taureye-web
    container_name: taureye-web
    restart: unless-stopped
    ports:
      # Host nginx is the public TLS edge (80/443) and reverse-proxies to this
      # container on localhost. Publish to 127.0.0.1 only so we never collide with
      # host nginx for port 80.
      - "127.0.0.1:8080:80"
    volumes:
      # The dataengine writes the JSON bundle here; nginx serves it read-only.
      - ./data/bundle:/usr/share/nginx/html/data:ro

  # ---- Data engine: pulls EOD -> SQLite spine -> exports the JSON bundle ----
  # Stays alive (sleep) so the scheduler can `exec` the nightly refresh into it,
  # mirroring the existing `docker compose exec` pattern.
  dataengine:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: taureye-dataengine
    container_name: taureye-dataengine
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      TAUREYE_PROVIDER: db
      TAUREYE_DATA_DIR: /app/backend/data
      TAUREYE_DB_PATH: /app/backend/data/market.db
    volumes:
      - ./data/spine:/app/backend/data       # market.db + logs (persisted)
      - ./data/bundle:/data/bundle           # export target (shared with web)
    command: ["sleep", "infinity"]
    labels:
      ofelia.enabled: "true"
      # 15:30 UTC = 21:00 IST (safely after the 15:30 IST market close + EOD publish).
      # Cron is 6-field (sec min hour dom mon dow). Schedule is evaluated in UTC.
      ofelia.job-exec.nightly-refresh.schedule: "0 30 15 * * *"
      ofelia.job-exec.nightly-refresh.command: >-
        bash -lc "python -m backend.app.dataengine.run nightly &&
        python -m backend.app.dataengine.run export --all --gz --out /data/bundle"

  # ---- Cron-in-Docker: fires the nightly refresh by reading the labels above ----
  scheduler:
    image: mcuadros/ofelia:latest
    container_name: taureye-scheduler
    restart: unless-stopped
    depends_on:
      - dataengine
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---- OmniRoute: self-hosted AI gateway (OpenAI-compatible, many providers) ----
  # The AI Edge Functions (ai-analysis, ai-report) call this instead of Anthropic
  # directly when their OMNIROUTE_URL secret is set. Published on loopback for the
  # dashboard (SSH-tunnel to http://localhost:20128). For the Supabase edge-runtime
  # to reach it, connect this container to the Supabase network — see
  # docs/OMNIROUTE.md.  Opt-in: only starts with `--profile ai`.
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: taureye-omniroute
    restart: unless-stopped
    profiles: ["ai"]
    environment:
      PORT: "20128"
      DATA_DIR: /data
      # Require a bearer token on the API (recommended once other containers can
      # reach it). Set OMNIROUTE_API_KEY in .env and pass the same to the edge fn.
      REQUIRE_API_KEY: ${OMNIROUTE_REQUIRE_API_KEY:-false}
    ports:
      - "127.0.0.1:20128:20128"   # dashboard + API on the host loopback only
    volumes:
      - ./data/omniroute:/data     # persist provider keys + routing config
