# TaurEye — security headers for the HOST nginx (the HTTPS/TLS edge).
#
# Install once, then include it in each HTTPS server block:
#   sudo cp deploy/azure/nginx-security-headers.conf /etc/nginx/snippets/taureye-security.conf
#   # in /etc/nginx/sites-available/taureye, inside each `server { listen 443 ssl; ... }`:
#   include /etc/nginx/snippets/taureye-security.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Put it at the edge (not the web container): HSTS is only honored over HTTPS,
# and setting headers in one place avoids duplicates behind the reverse proxy.

# Don't leak the nginx version in the Server header.
server_tokens off;

# Force HTTPS for a year (incl. subdomains). Only add once you're confident all
# subdomains are HTTPS — it's sticky in browsers. Drop 'includeSubDomains' if not.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Stop MIME-sniffing, limit framing (clickjacking), trim referrer leakage.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Conservative permissions policy (no camera/mic/geolocation by default).
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
