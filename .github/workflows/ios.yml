name: Build iOS (unsigned)

# Compiles the iOS app on a macOS runner to verify it builds (Capacitor iOS is
# generated fresh each run — the ios/ folder is NOT committed). This produces an
# UNSIGNED iOS Simulator build: proof it compiles + the foundation for a signed
# TestFlight build later.
#
# To install on a REAL iPhone you need an Apple Developer Program membership
# ($99/yr) + code signing + TestFlight — at which point this workflow gets the
# signing secrets and switches to a signed archive/export. Until then this is a
# build check only (Simulator .app can't be installed on a device).
#
# Run it from GitHub (mobile browser): Actions -> "Build iOS (unsigned)" ->
# Run workflow.

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build the SPA (LOCAL data mode, VM absolute URLs — same as the APK/OTA)
        run: npm run build
        env:
          VITE_DATA_SOURCE: "local"
          VITE_DATA_BASE: "https://taureye.com/data"
          VITE_CANDLE_BASE: "https://taureye.com/data"
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OAUTH_PROVIDERS: ${{ vars.VITE_OAUTH_PROVIDERS }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}

      - name: Add + sync the Capacitor iOS platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Configure Info.plist (ATS for the HTTP data VM + OAuth URL scheme)
        run: |
          PLIST="ios/App/App/Info.plist"
          PB="/usr/libexec/PlistBuddy"
          # The data bundle + API are served over HTTPS (taureye.com / api.taureye.com).
          # NSAllowsArbitraryLoads is kept as a safety net; tighten to a scoped
          # NSExceptionDomains entry if a cleartext host is ever reintroduced.
          $PB -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSAppTransportSecurity dict" "$PLIST"
          $PB -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          # Custom URL scheme so the OAuth deep link (app.taureye.mobile://auth-callback) returns to the app.
          $PB -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes array" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLName string app.taureye.mobile" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string app.taureye.mobile" "$PLIST"
          echo "--- Info.plist ---"; plutil -p "$PLIST"

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Build (unsigned, iOS Simulator)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ENABLE_BITCODE=NO \
            build

      - name: Package the build
        run: |
          APP=ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if [ -d "$APP" ]; then
            cd "$(dirname "$APP")" && zip -qr "$GITHUB_WORKSPACE/TaurEye-ios-sim.zip" App.app
            echo "Zipped $APP"
          else
            echo "::warning::App.app not found — build may have failed."
          fi

      - name: Upload Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: taureye-ios-sim
          path: TaurEye-ios-sim.zip
          if-no-files-found: warn
