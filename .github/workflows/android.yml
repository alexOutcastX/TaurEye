name: Build Android APK

# Builds a debug APK in the cloud (GitHub-hosted runner already has the Android
# SDK + JDK 17), so you don't need to install anything locally.
#
# Run it: push to main, or trigger manually from the Actions tab. The APK is
# uploaded as a build artifact you can download and sideload onto a phone.
#
# IMPORTANT: set the backend the app talks to via the VITE_API_BASE repo
# variable (Settings → Secrets and variables → Actions → Variables). Example:
#   VITE_API_BASE = https://api.taureye.example
# A LAN IP (http://192.168.x.x:8010) only works while your phone is on the same
# network as the machine running the backend.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync Capacitor
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taureye-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
