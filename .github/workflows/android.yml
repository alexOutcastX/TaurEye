name: Build Android APK

# Builds a debug APK in the cloud (GitHub-hosted runner already has the Android
# SDK + JDK 17), so you don't need to install anything locally.
#
# Run it: push to main, or trigger manually from the Actions tab. The APK is
# uploaded as a build artifact you can download and sideload onto a phone.
#
# The app is built in LOCAL data mode (the production model): it reads the
# precomputed JSON bundle from the VM by absolute URL (VITE_DATA_BASE /
# VITE_CANDLE_BASE below) — there is NO live /api backend. Keep these in sync
# with mobile-ota.yml so the sideloaded APK and the OTA bundles behave the same.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the APK as a GitHub Release asset
    steps:
      - uses: actions/checkout@v4

      - name: Add google-services.json (enables FCM push) if provided
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            printf '%s' "$GS" > android/app/google-services.json
            echo "Wrote android/app/google-services.json ($(wc -c < android/app/google-services.json) bytes) — FCM enabled."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — APK will build WITHOUT push (no FCM token)."
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI requires Node >=22 (cap sync fails on 20).
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          # Capacitor 8's Android libraries target Java 21 (compile fails on 17
          # with "invalid source release: 21").
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync Capacitor
        # Build in LOCAL data mode (the production model): the app reads the
        # precomputed JSON bundle from the VM by absolute URL — there is no live
        # /api backend. Mirrors mobile-ota.yml so the APK and OTA bundles match.
        env:
          VITE_DATA_SOURCE: "local"
          # nginx serves the bundle under /data, so the base must include it.
          VITE_DATA_BASE: "http://161.118.174.177/data"
          VITE_CANDLE_BASE: "http://161.118.174.177/data"
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OAUTH_PROVIDERS: ${{ vars.VITE_OAUTH_PROVIDERS }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taureye-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the APK as a GitHub Release asset so it has a stable, login-free
      # direct-download link that works in a phone browser (Actions artifacts are
      # login-gated zips and awkward to grab on mobile). The "mobile-latest"
      # release is recreated each push to main so the link always serves the
      # newest build:
      #   https://github.com/alexOutcastX/TaurEye/releases/download/mobile-latest/TaurEye-debug.apk
      - name: Publish APK to GitHub Release (mobile-friendly download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TaurEye-debug.apk
          # Drop any previous rolling release+tag so the asset name never clashes
          # and the tag points at this commit.
          gh release delete mobile-latest --yes --cleanup-tag || true
          gh release create mobile-latest TaurEye-debug.apk \
            --title "TaurEye debug APK (latest)" \
            --notes "Auto-built debug APK from main (${GITHUB_SHA}). Sideload on Android: enable 'Install unknown apps' for your browser, then open the .apk. If an older TaurEye debug build is installed, uninstall it first (debug signatures differ per build)." \
            --prerelease
