name: Data ops (VM)

# Run a data-engine command on the Oracle VM from your phone — no SSH app needed.
# GitHub (mobile browser) -> Actions -> "Data ops (VM)" -> Run workflow -> pick a
# command -> open the run -> read the output in the "Run on VM" step log.
#
# SAFETY: `command` is a fixed dropdown (allow-list) and `symbol` is sanitized to
# letters/digits, so no freeform text ever reaches the VM shell — there is no
# arbitrary-command surface. Only repo collaborators can trigger it.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        required: true
        default: "funda-probe"
        options:
          - "funda-probe"          # raw BSE JSON for one symbol (uses 'symbol')
          - "funda --limit 50"     # fetch fundamentals for 50 biggest due names
          - "funda --limit 800"    # a nightly-sized slice
          - "funda"                # all due
          - "export --funda --gz"  # publish per-symbol funda files
          - "status"               # spine health
      symbol:
        description: "Symbol for funda-probe (letters/digits only)"
        required: false
        default: "RELIANCE"

concurrency:
  group: dataops-vm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run on VM
        env:
          U: ${{ secrets.VM_USER }}
          H: ${{ secrets.VM_HOST }}
          CHOICE: ${{ inputs.command }}
          RAWSYM: ${{ inputs.symbol }}
        run: |
          # Sanitize the symbol to a safe charset (strips spaces, ;, `, $, etc.).
          SYM=$(printf '%s' "$RAWSYM" | tr -cd 'A-Za-z0-9._&-')
          # CHOICE is a GitHub `choice` input — validated against the fixed list
          # above, so it cannot be an arbitrary string. Build the final args from
          # the allow-listed choice + sanitized symbol only.
          case "$CHOICE" in
            "funda-probe") ARGS="funda-probe ${SYM:-RELIANCE}" ;;
            "funda --limit 50"|"funda --limit 800"|"funda"|"export --funda --gz"|"status") ARGS="$CHOICE" ;;
            *) echo "rejected command: $CHOICE"; exit 1 ;;
          esac
          echo "::group::dataengine run $ARGS"
          ssh -i ~/.ssh/id_deploy "$U@$H" \
            "cd /opt/taureye && . venv/bin/activate && python -m backend.app.dataengine.run $ARGS"
          echo "::endgroup::"
