name: Data ops (VM)

# Run a data-engine command on the Oracle VM from your phone — no SSH app needed.
# GitHub (mobile browser) -> Actions -> "Data ops (VM)" -> Run workflow -> pick a
# command -> open the run -> read the output in the "Run on VM" step log.
#
# SAFETY: `command` is a fixed dropdown (allow-list) and `symbol` is sanitized to
# letters/digits, so no freeform text ever reaches the VM shell — there is no
# arbitrary-command surface. Only repo collaborators can trigger it.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        required: true
        default: "status"
        options:
          - "status"                            # spine health + last data date
          - "db paths"                          # which market.db the cron vs dataops use (confirm same file)
          - "kill stuck data jobs"              # free a locked DB (stuck/zombie engine process)
          - "backfill 20d + publish"            # re-ingest the last 20 trading days (fills gaps), then publish
          - "dedupe ISINs (dry-run)"            # preview: which symbols have >1 active ISIN row (no writes)
          - "fix duplicate ISINs + publish"     # retire stale duplicate ISIN rows (keep freshest), then publish
          - "refresh (nightly + publish)"       # pull today's EOD + corp-actions + readjust, then publish to nginx
          - "nightly"                           # pull EOD + corp-actions + readjust (no publish)
          - "publish bundle (export --all)"     # re-export metrics/indices/candles to nginx
          - "corp-actions"                      # refresh corporate actions only
          - "readjust"                          # re-apply corporate-action adjustments
          - "publish funda files"               # per-symbol funda files to nginx
          - "eodhd --limit 25"                  # smoke-test fundamentals fetch
          - "eodhd --limit 500"                 # a nightly-sized slice
          - "eodhd-probe"                       # validate EODHD key/plan on one symbol
          - "inspect symbol"                    # diagnose one symbol's spine: ISIN map + last dates (uses 'symbol')
          - "funda-probe"                       # raw BSE JSON for one symbol (uses 'symbol')
          - "announcements --days 7"            # BSE filings (bot-walled from VM; kept for reference)
      symbol:
        description: "Symbol for funda-probe (letters/digits only)"
        required: false
        default: "RELIANCE"

concurrency:
  group: dataops-vm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run on VM
        env:
          U: ${{ secrets.VM_USER }}
          H: ${{ secrets.VM_HOST }}
          CHOICE: ${{ inputs.command }}
          RAWSYM: ${{ inputs.symbol }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          # Sanitize the symbol to a safe charset (strips spaces, ;, `, $, etc.).
          SYM=$(printf '%s' "$RAWSYM" | tr -cd 'A-Za-z0-9._&-')
          WEBROOT="/usr/share/nginx/html/data"
          PYRUN="cd /opt/taureye && . venv/bin/activate && python -m backend.app.dataengine.run"
          # restorecon: re-label freshly written files so SELinux lets nginx read them.
          RELABEL="sudo restorecon -R $WEBROOT >/dev/null 2>&1 || true"
          # CHOICE is a GitHub `choice` input — validated against the fixed list
          # above, so it cannot be an arbitrary string. Build the remote command
          # from the allow-listed choice + sanitized symbol only. Publish steps
          # target the nginx web root (NOT export's default public/data) so the
          # live app actually sees the new data.
          # inspect: a READ-ONLY per-symbol diagnostic shipped as a base64 inline
          # script so it needs no new code on the VM. It only SELECTs from market.db
          # (imports the engine's own db module, so it hits the exact DB backfill
          # writes) and prints the symbol's ISIN map + first/last price dates. The
          # readable source lives at deploy/inspect_symbol.py.
          INSPECT_B64=""
          # dedupe: retire stale duplicate ISIN rows left by ISIN changes (a
          # READ + targeted active-flag UPDATE; no price rows touched, reversible).
          # Source: deploy/dedupe_isins.py. DRY=1 previews without writing.
          DEDUPE_B64=""
          # db paths: prints which market.db each entrypoint resolves to (READ-ONLY).
          # Source: deploy/db_paths.py.
          DBPATHS_B64=""
          case "$CHOICE" in
            "db paths") REMOTE="cd /opt/taureye && . venv/bin/activate && printf %s '$DBPATHS_B64' | base64 -d | python" ;;
            "inspect symbol") REMOTE="cd /opt/taureye && . venv/bin/activate && export SYM='${SYM:-RELIANCE}'; printf %s '$INSPECT_B64' | base64 -d | python" ;;
            "dedupe ISINs (dry-run)") REMOTE="cd /opt/taureye && . venv/bin/activate && export DRY=1; printf %s '$DEDUPE_B64' | base64 -d | python" ;;
            "fix duplicate ISINs + publish") REMOTE="cd /opt/taureye && . venv/bin/activate && printf %s '$DEDUPE_B64' | base64 -d | python && $PYRUN export --all --gz --out $WEBROOT && $RELABEL" ;;
            "funda-probe") REMOTE="$PYRUN funda-probe ${SYM:-RELIANCE}" ;;
            "eodhd-probe") REMOTE="$PYRUN eodhd-probe ${SYM:-RELIANCE}" ;;
            "kill stuck data jobs") REMOTE="pkill -9 -f 'app[.]dataengine[.]run' || true; sleep 1; pgrep -af 'app[.]dataengine[.]run' || echo 'OK: no data-engine processes running — DB lock released'" ;;
            "backfill 20d + publish") REMOTE="$PYRUN backfill --days 20 && $PYRUN export --all --gz --out $WEBROOT && $RELABEL" ;;
            "refresh (nightly + publish)") REMOTE="$PYRUN nightly && $PYRUN export --all --gz --out $WEBROOT && $RELABEL" ;;
            "nightly") REMOTE="$PYRUN nightly" ;;
            "corp-actions") REMOTE="$PYRUN corp-actions" ;;
            "readjust") REMOTE="$PYRUN readjust" ;;
            "publish bundle (export --all)") REMOTE="$PYRUN export --all --gz --out $WEBROOT && $RELABEL" ;;
            "publish funda files") REMOTE="$PYRUN export --funda --gz --out $WEBROOT && $RELABEL" ;;
            "eodhd --limit 25"|"eodhd --limit 500"|"announcements --days 7"|"status") REMOTE="$PYRUN $CHOICE" ;;
            *) echo "rejected command: $CHOICE"; exit 1 ;;
          esac
          echo "::group::dataengine: $CHOICE"
          # The EODHD key is passed via stdin (not the command line), so it never
          # appears in remote process lists; GitHub masks it in this job's logs.
          printf '%s\n' "$EODHD_API_KEY" | ssh -i ~/.ssh/id_deploy \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=40 -o ConnectTimeout=20 \
            "$U@$H" \
            "read -r EODHD_API_KEY; export EODHD_API_KEY; $REMOTE"
          echo "::endgroup::"
