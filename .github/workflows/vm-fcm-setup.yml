name: VM — FCM setup

# One-click VM provisioning for push notifications, run THROUGH the same SSH
# pipeline the deploys already use (secrets VM_SSH_KEY / VM_USER / VM_HOST) — so
# you don't need to SSH from your laptop. It:
#   1. writes the Firebase service-account JSON to /opt/taureye/secrets/fcm.json
#   2. installs firebase-admin into the venv
#   3. installs the updated refresh.sh (which calls the push sender after export)
#   4. (optional) adds a public key to authorized_keys so you regain local SSH
#   5. sends a test push to the "eod" topic
#
# Setup before running (Settings → Secrets and variables → Actions):
#   - Secret  FCM_SERVICE_ACCOUNT  = full contents of the Firebase service-account JSON
#   - (optional) Variable EXTRA_SSH_PUBKEY = contents of your *.key.pub to re-enable SSH
# Then run this workflow from the Actions tab (Run workflow).

on:
  workflow_dispatch: {}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH (same key the deploys use)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write service-account JSON to the VM
        env:
          U: ${{ secrets.VM_USER }}
          H: ${{ secrets.VM_HOST }}
          FCM_SA: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FCM_SA" ]; then
            echo "::error::FCM_SERVICE_ACCOUNT secret is not set"; exit 1
          fi
          printf '%s' "$FCM_SA" > fcm.json
          ssh -i ~/.ssh/id_deploy "$U@$H" 'mkdir -p /opt/taureye/secrets && chmod 700 /opt/taureye/secrets'
          scp -i ~/.ssh/id_deploy fcm.json "$U@$H:/opt/taureye/secrets/fcm.json"
          rm -f fcm.json
          ssh -i ~/.ssh/id_deploy "$U@$H" 'chmod 600 /opt/taureye/secrets/fcm.json'

      - name: Install firebase-admin + the updated refresh.sh
        env:
          U: ${{ secrets.VM_USER }}
          H: ${{ secrets.VM_HOST }}
        run: |
          # the updated refresh.sh (with the push hook) from the repo
          scp -i ~/.ssh/id_deploy deploy/refresh.sh "$U@$H:/opt/taureye/refresh.sh"
          ssh -i ~/.ssh/id_deploy "$U@$H" '
            chmod +x /opt/taureye/refresh.sh &&
            /opt/taureye/venv/bin/pip install --quiet firebase-admin
          '

      - name: (optional) Re-enable your local SSH key
        if: ${{ vars.EXTRA_SSH_PUBKEY != '' }}
        env:
          U: ${{ secrets.VM_USER }}
          H: ${{ secrets.VM_HOST }}
          PUBKEY: ${{ vars.EXTRA_SSH_PUBKEY }}
        run: |
          ssh -i ~/.ssh/id_deploy "$U@$H" "mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && grep -qF \"$PUBKEY\" ~/.ssh/authorized_keys || echo \"$PUBKEY\" >> ~/.ssh/authorized_keys"
          echo "Added your public key — you can now: ssh -i <yourkey> ${U}@${H}"

      - name: Send a test push (topic 'eod')
        env:
          U: ${{ secrets.VM_USER }}
          H: ${{ secrets.VM_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "$U@$H" 'cd /opt/taureye && ./venv/bin/python -m backend.app.push'
