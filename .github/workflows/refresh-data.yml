name: Refresh data (manual)

# Phone-friendly button to inspect / force the VM EOD refresh.
#
#   mode = diagnose (default)  -> read-only: print refresh.log + published
#                                 data_date. Fast, never hangs. Use this first.
#   mode = refresh             -> sync exporter + run refresh.sh (time-boxed),
#                                 then print the log + data_date.
#
# Reuses the deploy secrets (VM_HOST / VM_USER / VM_SSH_KEY).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose (read log only) or refresh (force a pull)"
        type: choice
        default: diagnose
        options: [diagnose, refresh]

concurrency:
  group: refresh-vm
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # cap; a full refresh legitimately takes ~45 min
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync exporter code + refresh.sh to the VM
        if: ${{ inputs.mode == 'refresh' }}
        env:
          U: ${{ secrets.VM_USER }}
          H: ${{ secrets.VM_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "$U@$H" 'mkdir -p /opt/taureye/backend'
          rsync -az --delete --exclude 'data' --exclude 'saved_screens.json' \
            -e "ssh -i ~/.ssh/id_deploy" backend/ "$U@$H:/opt/taureye/backend/"
          rsync -az -e "ssh -i ~/.ssh/id_deploy" deploy/refresh.sh "$U@$H:/opt/taureye/refresh.sh"
          ssh -i ~/.ssh/id_deploy "$U@$H" 'chmod +x /opt/taureye/refresh.sh'

      - name: Run the refresh on the VM (time-boxed to 50 min)
        if: ${{ inputs.mode == 'refresh' }}
        env:
          U: ${{ secrets.VM_USER }}
          H: ${{ secrets.VM_HOST }}
        run: |
          # `timeout` on the VM side so a stuck network fetch can't block forever;
          # `|| true` so we still print the log on timeout/failure.
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=8 -i ~/.ssh/id_deploy "$U@$H" \
            'cd /opt/taureye && timeout 3000 ./refresh.sh; echo "[ci] refresh exit=$?"' || true

      - name: Show the latest refresh log + published data date
        if: ${{ always() }}
        env:
          U: ${{ secrets.VM_USER }}
          H: ${{ secrets.VM_HOST }}
        run: |
          echo "::group::refresh.log (last 150 lines)"
          ssh -i ~/.ssh/id_deploy "$U@$H" 'tail -n 150 /opt/taureye/backend/data/refresh.log 2>/dev/null' || echo "(no log)"
          echo "::endgroup::"
          echo "::group::Published data_date (from the served bundle)"
          ssh -i ~/.ssh/id_deploy "$U@$H" \
            'python3 -c "import json;print(\"data_date =\", json.load(open(\"/usr/share/nginx/html/data/indices.json\")).get(\"data_date\"))" 2>/dev/null' || echo "(could not read indices.json)"
          echo "::endgroup::"
