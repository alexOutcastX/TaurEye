    const spec = {"openapi": "3.1.0", "info": {"title": "TaurEye API", "description": "**TaurEye API** serves the Indian-equity screener, charts, and reference data\nthat power the TaurEye web and mobile apps.\n\nAll data is **factual market information only** \u2014 prices, technical indicators,\nand market caps computed from end-of-day (EOD) data. Nothing here is investment\nadvice, and TaurEye is not a SEBI-registered Investment Adviser or Research\nAnalyst.\n\n### Data freshness\nEndpoints back onto an EOD price spine. The most recent trading date is reported\nby `GET /api/indices` (`data_date`) and the universe size by `GET /api/health`.\n\n### Trying it out\nUse the **Try it out** button on any endpoint below. Request bodies (e.g.\n`POST /api/screen`) come pre-filled with a working example you can edit and run.\n\n### Authentication\nAuth is **optional** and off by default for local/LAN use. If the server sets\nthe `TAUREYE_API_KEY` environment variable (e.g. on a public host), every\n`/api/*` call except `/api/health` must present the key via the `X-API-Key`\nheader or a `?key=` query parameter. See the **ApiKeyHeader** scheme below.", "termsOfService": "https://taureye.app/terms", "contact": {"name": "TaurEye", "url": "https://taureye.app/"}, "license": {"name": "Proprietary"}, "version": "1.0.0"}, "servers": [{"url": "http://localhost:8010", "description": "Local dev (via this machine)"}, {"url": "http://{lan_ip}:8010", "description": "LAN \u2014 replace {lan_ip} with your PC's IP for device testing", "variables": {"lan_ip": {"default": "192.168.1.20"}}}], "paths": {"/": {"get": {"tags": ["System"], "summary": "Service banner", "description": "Friendly JSON banner shown when the API port is opened directly. Points to the docs.", "operationId": "root__get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"additionalProperties": true, "type": "object", "title": "Response Root  Get"}, "example": {"service": "TaurEye API", "status": "ok", "hint": "This is the backend API. Open the app at http://localhost:5174", "docs": "/docs"}}}}}}}, "/api/health": {"get": {"tags": ["System"], "summary": "Health check", "description": "Liveness probe. Reports the loaded universe size and the active data provider (`db` = real EOD data, `synthetic` = generated demo data). Always reachable, even when an API key is set.", "operationId": "health_api_health_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"additionalProperties": true, "type": "object", "title": "Response Health Api Health Get"}, "example": {"status": "ok", "universe": 5833, "provider": "db"}}}}}}}, "/api/fields": {"get": {"tags": ["Market Data"], "summary": "Screenable fields", "description": "The catalog of numeric metrics that can be filtered/sorted in the screener, with display labels, units, groups, and descriptions. Use a field's `key` in `Filter.field` and `sort_by`.", "operationId": "fields_api_fields_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"items": {"$ref": "#/components/schemas/FieldDef"}, "type": "array", "title": "Response Fields Api Fields Get"}}}}}}}, "/api/indices": {"get": {"tags": ["Market Data"], "summary": "Market indices + data date", "description": "Live index ticker (NIFTY, BANK NIFTY, SENSEX, INDIA VIX, USD/INR) plus the EOD `data_date` the prices belong to. Factual levels only \u2014 informational, not advice.", "operationId": "indices_api_indices_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"additionalProperties": true, "type": "object", "title": "Response Indices Api Indices Get"}, "example": {"indices": [{"key": "NIFTY", "label": "NIFTY", "value": 23414.6, "change_pct": 0.04}, {"key": "BANKNIFTY", "label": "BANK NIFTY", "value": 54229.7, "change_pct": 0.08}, {"key": "INDIAVIX", "label": "INDIA VIX", "value": 16.06, "change_pct": -1.36}, {"key": "USDINR", "label": "USD/INR", "value": 95.79}], "as_of": "2026-06-04T08:33:25.670268+00:00", "data_date": "2026-05-29"}}}}}}}, "/api/segments": {"get": {"tags": ["Market Data"], "summary": "Instrument segments", "description": "Available instrument segments with live counts (EQ/ETF/SME), for the screener's include/exclude control. Computed from the current snapshot.", "operationId": "segments_api_segments_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"items": {"additionalProperties": true, "type": "object"}, "type": "array", "title": "Response Segments Api Segments Get"}, "example": [{"key": "EQ", "label": "Equity", "count": 5200}, {"key": "ETF", "label": "ETF", "count": 410}, {"key": "SME", "label": "SME", "count": 223}]}}}}}}, "/api/securities": {"get": {"tags": ["Securities"], "summary": "Search securities", "description": "Search the universe by symbol or company name. Powers the scrip search box. Case-insensitive substring match; optionally restrict by exchange.", "operationId": "securities_api_securities_get", "parameters": [{"name": "q", "in": "query", "required": false, "schema": {"anyOf": [{"type": "string"}, {"type": "null"}], "description": "Search text matched against symbol and name.", "examples": ["reliance"], "title": "Q"}, "description": "Search text matched against symbol and name."}, {"name": "exchange", "in": "query", "required": false, "schema": {"anyOf": [{"type": "string"}, {"type": "null"}], "description": "Restrict to one exchange: NSE or BSE.", "examples": ["NSE"], "title": "Exchange"}, "description": "Restrict to one exchange: NSE or BSE."}, {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "maximum": 500, "minimum": 1, "description": "Maximum rows to return.", "default": 50, "title": "Limit"}, "description": "Maximum rows to return."}], "responses": {"200": {"description": "Successful Response", "content ecent daily candles to return."}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Candle"}, "title": "Response Candles Api Candles  Symbol  Get"}}}}, "404": {"description": "Unknown symbol"}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/screens": {"get": {"tags": ["Saved Screens"], "summary": "List saved screens", "description": "Return all saved screen definitions on the server, newest first.", "operationId": "list_screens_api_screens_get", "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"items": {"$ref": "#/components/schemas/SavedScreen"}, "type": "array", "title": "Response List Screens Api Screens Get"}}}}}}, "post": {"tags": ["Saved Screens"], "summary": "Save a screen", "description": "Persist a named screen definition and return it with a server-assigned id and timestamp.", "operationId": "create_screen_api_screens_post", "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/SaveScreenRequest"}}}, "required": true}, "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SavedScreen"}}}}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}, "/api/screens/{screen_id}": {"delete": {"tags": ["Saved Screens"], "summary": "Delete a saved screen", "description": "Delete a saved screen by id. Returns the deleted id, or 404 if it does not exist.", "operationId": "delete_screen_api_screens__screen_id__delete", "parameters": [{"name": "screen_id", "in": "path", "required": true, "schema": {"type": "string", "description": "Id returned when the screen was saved.", "title": "Screen Id"}, "description": "Id returned when the screen was saved."}], "responses": {"200": {"description": "Successful Response", "content": {"application/json": {"schema": {"type": "object", "additionalProperties": true, "title": "Response Delete Screen Api Screens  Screen Id  Delete"}, "example": {"deleted": "scr_a1b2c3"}}}}, "404": {"description": "Screen not found"}, "422": {"description": "Validation Error", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HTTPValidationError"}}}}}}}}, "components": {"schemas": {"Candle": {"properties": {"date": {"type": "string", "title": "Date"}, "open": {"type": "number", "title": "Open"}, "high": {"type": "number", "title": "High"}, "low": {"type": "number", "title": "Low"}, "close": {"type": "number", "title": "Close"}, "volume": {"type": "integer", "title": "Volume"}}, "type": "object", "required": ["date", "open", "high", "low", "close", "volume"], "title": "Candle"}, "FieldDef": {"properties": {"key": {"type": "string", "title": "Key"}, "label": {"type": "string", "title": "Label"}, "group": {"type": "string", "title": "Group"}, "type": {"type": "string", "const": "number", "title": "Type", "default": "number"}, "unit": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Unit"}, "desc": {"anyOf": [{"type": "string"}, {"type": "null"}], "title": "Desc"}}, "type": "object", "required": ["key", "label", "group"], "title": "FieldDef"}, "Filter": {"properties": {"field": {"type": "string", "title": "Field", "description": "Metric key to filter on (see GET /api/fields), e.g. 'rsi_14'."}, "op": {"type": "string", "enum": ["gt", "gte", "lt", "lte", "eq", "between"], "title": "Op", "description": "Comparison operator. 'between' uses value..value2."}, "value": {"type": "number", "title": "Value", "description": "Threshold value (lower bound for 'between').", "default": 0}, "value2": {"anyOf": [{"type": "number"}, {"type": "null"}], "title": "Value2", "description": "Upper bound, only for op='between'."}}, "type": "
